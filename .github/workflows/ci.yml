name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_DB: swarmjet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swarmjet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
      - name: Test and vet
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@localhost:5432/swarmjet_test?sslmode=disable
        run: |
          go test -race ./cmd/... ./internal/...
          go vet ./cmd/... ./internal/...

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and browser tests
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://swarmjet:validation-only@postgres:5432/swarmjet?sslmode=disable
      POSTGRES_PASSWORD: validation-only
      ADMIN_PASSWORD: validation-only-password
      DATA_DIR: /tmp/swarmjet-validation
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and shell scripts
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml --profile tools config --quiet
          docker compose -f examples/http-check/compose.yaml config --quiet
          sh -n scripts/askpass.sh deploy/temporal/schema.sh deploy/temporal/namespace.sh

  images:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/swarmjet:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
          build-args: |
            RELEASE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            RELEASE_COMMIT=${{ github.sha }}
      - name: Publish agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/swarmjet/agent:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
