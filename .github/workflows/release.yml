name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.semver.outputs.publish }}
    steps:
      - id: semver
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/checks.yml

  images:
    needs: [guard, checks]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/swarmjet:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/swarmjet:latest
          build-args: |
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_COMMIT=${{ github.sha }}
      - name: Publish agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/swarmjet/agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/swarmjet/agent:latest
          build-args: |
            OMP_VERSION=18.12.2
            AGENT_CLIS=codex,claude,dst,agy
