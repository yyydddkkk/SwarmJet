name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_DB: swarmjet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swarmjet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
      - name: Test and vet
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@localhost:5432/swarmjet_test?sslmode=disable
        run: |
          go test -race ./cmd/... ./internal/...
          go vet ./cmd/... ./internal/...

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and browser tests
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://swarmjet:validation-only@postgres:5432/swarmjet?sslmode=disable
      POSTGRES_PASSWORD: validation-only
      RABBITMQ_PASSWORD: validation-only-rabbitmq
      ADMIN_PASSWORD: validation-only-password
      RUNTIME_ADMIN_SECRET: validation-only-secret
      SWARMJET_MASTER_KEY: validation-only-master
      DATA_DIR: /tmp/swarmjet-compose-validation
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and shell scripts
        run: |
          docker compose -f deploy/compose.yaml --profile tools config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml --profile tools config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml -f deploy/compose.local-node.yaml --profile tools config --quiet
          docker compose -f examples/http-check/compose.yaml config --quiet
          sh -n scripts/askpass.sh deploy/temporal/schema.sh deploy/temporal/namespace.sh

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deploy scripts
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
