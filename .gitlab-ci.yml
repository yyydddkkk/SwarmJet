stages: [check, image]

Go checks:
  stage: check
  image: golang:1.27.1-bookworm
  services:
    - name: postgres:18.1-alpine3.23
      alias: postgres
  variables:
    POSTGRES_DB: swarmjet_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ci-disposable-only
    TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@postgres:5432/swarmjet_test?sslmode=disable
  script:
    - go test -race ./cmd/... ./internal/...
    - go vet ./cmd/... ./internal/...

Console checks:
  stage: check
  image: node:24.21.0-bookworm-slim
  script:
    - cd web
    - npm ci
    - npm run build
    - npx playwright install --with-deps chromium
    - npm test
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [web/test-results/, web/playwright-report/]

Compose validation:
  stage: check
  image: docker:29.8.1-cli
  variables:
    DATABASE_URL: postgres://swarmjet:validation-only@postgres:5432/swarmjet?sslmode=disable
    POSTGRES_PASSWORD: validation-only
    ADMIN_PASSWORD: validation-only-password
    DATA_DIR: /tmp/swarmjet-validation
  script:
    - docker compose -f deploy/compose.yaml config --quiet
    - docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml --profile tools config --quiet
    - docker compose -f examples/http-check/compose.yaml config --quiet
    - sh -n scripts/askpass.sh deploy/temporal/schema.sh deploy/temporal/namespace.sh

# Requires a runner configured for privileged Docker-in-Docker and Registry enabled.
Publish images:
  stage: image
  image: docker:29.8.1-cli
  services:
    - name: docker:29.8.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - IMAGE_TAG="${CI_COMMIT_TAG:-main}"
    - RELEASE_VERSION="${CI_COMMIT_TAG:-dev}"
    - docker build --platform linux/amd64 --build-arg "RELEASE_VERSION=$RELEASE_VERSION" --build-arg "RELEASE_COMMIT=$CI_COMMIT_SHA" -f deploy/Dockerfile -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker build --platform linux/amd64 -f deploy/Dockerfile.agent -t "$CI_REGISTRY_IMAGE/agent:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/agent:$IMAGE_TAG"
