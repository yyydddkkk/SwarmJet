<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmJet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F3EF;--ink:#131927;--ink2:rgba(19,25,39,.74);--ink3:rgba(19,25,39,.46);--hair:rgba(19,25,39,.10);--accent:#8A6716;--veil:rgba(244,243,239,.96);
  --title:"IM Fell English","Noto Serif SC",serif;--serif:"Source Serif 4","Noto Serif SC",serif;--sans:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;--body:var(--serif);--mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0A1020;--ink:#DCE3EF;--ink2:rgba(220,227,239,.70);--ink3:rgba(220,227,239,.44);--hair:rgba(220,227,239,.09);--accent:#D7B35E;--veil:rgba(10,16,32,.95);
}}
:root[data-theme=dark]{--paper:#0A1020;--ink:#DCE3EF;--ink2:rgba(220,227,239,.70);--ink3:rgba(220,227,239,.44);--hair:rgba(220,227,239,.09);--accent:#D7B35E;--veil:rgba(10,16,32,.95);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
:root[data-style=simple]{--body:var(--sans);--title:var(--sans)}
:root[data-style=simple] body *{font-style:normal!important}
#mark b,#time .b,#cartouche h1,#almanac h2,#ap-nav h2,#ap-body h3,#catalogue h2,.note h4,#lens h2,#brief h2,#legend h4{font-family:var(--title)}
canvas{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:none}

#mark{position:fixed;left:60px;top:54px;display:flex;align-items:baseline;gap:18px}
#mark b{font-weight:400;font-style:italic;font-size:21px;color:var(--ink)}
#crumbs{font-style:italic;font-size:15px;color:var(--ink3)}
#crumbs a{cursor:pointer;color:inherit;text-decoration:none}
#crumbs a:hover,#crumbs a.on{color:var(--ink2)}
#crumbs i{margin:0 8px;font-style:normal}

#time{position:fixed;right:60px;top:52px;text-align:right;pointer-events:none}
#time .s{font-style:italic;font-size:16px;color:var(--ink3);font-variant-numeric:oldstyle-nums}
#time .b{font-weight:300;font-size:88px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .8s;margin-top:6px}
#time.on .b{opacity:1}

#cartouche{position:fixed;left:60px;bottom:58px;pointer-events:none}
#cartouche h1{font-weight:300;font-style:italic;font-size:30px;letter-spacing:.005em;transition:opacity .5s}
#cartouche p{font-size:16px;font-style:italic;color:var(--ink2);margin-top:8px;transition:opacity .5s}

#observer{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);width:34px;height:34px;cursor:pointer;display:grid;place-items:center}
#observer svg{width:18px;height:18px;overflow:visible}
#observer.wait::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--accent);animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.9);opacity:0}}

#say{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);width:300px;text-align:center;font-style:italic;font-size:16px;padding:4px 0;border-bottom:1px solid var(--hair);transition:width .5s cubic-bezier(.2,.8,.2,1),border-color .3s}
#say:focus{width:460px;border-color:var(--ink3)}
#say::placeholder{color:var(--ink3)}

#grid{position:fixed;right:142px;bottom:50px;width:30px;height:30px;color:var(--ink3);display:grid;place-items:center}
#grid:hover,#grid.on{color:var(--ink)}
#grid svg{width:18px;height:18px}
#theme{position:fixed;right:100px;bottom:50px;width:30px;height:30px;color:var(--ink3);display:grid;place-items:center}
#theme:hover{color:var(--ink)}
#theme svg{width:18px;height:18px}
#exposure{position:fixed;right:58px;bottom:50px;width:30px;height:30px;color:var(--ink3);display:grid;place-items:center}
#exposure:hover{color:var(--ink)}
#exposure svg{width:20px;height:20px}

button:focus-visible,input:focus-visible{outline:1px solid var(--ink2);outline-offset:5px}
@media (max-width:720px){#mark{left:30px;top:30px}#time{right:30px;top:30px}#time .b{font-size:56px}#cartouche{left:30px;bottom:120px}#cartouche h1{font-size:24px}#say{width:220px}#say:focus{width:calc(100vw - 60px)}#exposure{right:28px}#theme{right:66px}#grid{right:104px}#lens{width:100%;padding:90px 30px 40px}#hint{display:none}}
@media (prefers-reduced-motion:reduce){#observer.wait::after{animation:none;opacity:.8;transform:scale(1.3)}}
#cartouche{pointer-events:auto;cursor:pointer}
#cartouche:hover h1{color:var(--ink2)}
#mark b{cursor:pointer}
.sheet-x{position:absolute;top:44px;right:42px;font-size:22px;color:var(--ink3)}
.sheet-x:hover{color:var(--ink)}
#almanac{position:fixed;top:0;left:0;bottom:0;width:420px;background:var(--veil);border-right:1px solid var(--hair);padding:104px 48px 64px;transform:translateX(-100%);transition:transform .7s cubic-bezier(.2,.8,.2,1);z-index:6;overflow-y:auto;scrollbar-width:none}
#almanac.open{transform:none}
#almanac h2{font-weight:400;font-style:italic;font-size:34px}
#almanac .lead{font-size:17px;color:var(--ink2);margin-top:8px;line-height:1.6}
#almanac h3{font-weight:400;font-style:italic;font-size:20px;margin-top:44px;padding-bottom:8px;border-bottom:1px solid var(--hair)}
#almanac .mini{display:block;width:100%;height:96px;margin-top:18px}
#almanac .mini ellipse{fill:none;stroke:var(--ink3)}#almanac .mini circle{fill:var(--ink)}#almanac .mini text{fill:var(--ink2);font:italic 13px var(--serif)}
#almanac .rules p{font-size:16px;line-height:1.6;color:var(--ink2);margin-top:10px}
#almanac .files{font-family:var(--mono);font-size:12px;line-height:2;color:var(--ink3);margin-top:16px}
#almanac .vers{margin-top:16px;font-size:16px;color:var(--ink2);line-height:1.7}
#almanac .vers a{cursor:pointer;color:var(--ink3);margin-right:14px;font-style:italic;text-decoration:none}
#almanac .vers a:hover{color:var(--ink)}
.line{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:16px;color:var(--ink2)}
.line button{font-style:italic;font-size:16px;color:var(--ink2);border-bottom:1px solid var(--hair)}
.line button:hover{color:var(--ink)}
.slots{display:flex;gap:7px;align-items:center}
.slot{width:11px;height:11px;border-radius:50%;border:1px solid var(--ink2)}.slot.f{background:var(--ink);border-color:var(--ink)}
.step{width:22px;height:22px;color:var(--ink3);font-size:18px;line-height:1}.step:hover{color:var(--ink)}
.spark{display:block;width:100%;height:44px;margin-top:14px}.spark path{fill:none;stroke:var(--ink2);stroke-width:1}.spark circle{fill:var(--ink)}
.mute{font-size:16px;color:var(--ink3);margin-top:14px;line-height:1.6}
#appendix{position:fixed;left:26px;right:26px;bottom:26px;height:min(68vh,640px);background:var(--paper);border:1px solid var(--hair);outline:1px solid var(--hair);outline-offset:-7px;transform:translateY(calc(100% + 40px));transition:transform .75s cubic-bezier(.2,.8,.2,1);z-index:9;display:grid;grid-template-columns:230px minmax(0,1fr);padding:64px 72px 48px}
#appendix.open{transform:none}
#ap-nav h2{font-weight:400;font-style:italic;font-size:30px;margin-bottom:26px}
#ap-nav button{display:block;font-style:italic;font-size:19px;color:var(--ink3);padding:7px 0;text-align:left}
#ap-nav button:hover{color:var(--ink2)}#ap-nav button.on{color:var(--ink)}
#ap-body{max-width:640px;overflow-y:auto;scrollbar-width:none;padding-right:8px}
#ap-body h3{font-weight:400;font-style:italic;font-size:30px}
#ap-body>p{font-size:17px;line-height:1.7;color:var(--ink2);margin-top:12px;max-width:34em}
#ap-body .row{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:16px 0;border-bottom:1px solid var(--hair);font-size:17px}
#ap-body .row:first-of-type{margin-top:26px;border-top:1px solid var(--hair)}
#ap-body .row span{color:var(--ink2);font-style:italic;text-align:right}
#ap-body .acts{display:flex;gap:22px;margin-top:26px;font-style:italic;font-size:17px}
#ap-body .acts button{color:var(--ink2);border-bottom:1px solid var(--hair)}
#ap-body .acts .go{color:var(--accent);border-color:var(--accent)}
.bar{height:1px;background:var(--ink2);margin-top:8px}
#tl{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);width:min(640px,calc(100vw - 140px));display:flex;align-items:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .4s}
#tl.open{opacity:1;pointer-events:auto}
#tl button{font-style:italic;font-size:16px;color:var(--ink2);white-space:nowrap}
#tl button:hover{color:var(--ink)}
#tl-track{position:relative;flex:1;height:34px;cursor:ew-resize;touch-action:none}
#tl-track::before{content:"";position:absolute;left:0;right:0;top:12px;border-top:1px solid var(--ink3)}
#tl-handle{position:absolute;top:4px;width:1px;height:17px;background:var(--ink)}
#tl-handle::after{content:"";position:absolute;left:-4.5px;top:-5px;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);background:var(--paper)}
#tl-ticks span{position:absolute;top:20px;transform:translateX(-50%);font-style:italic;font-size:13px;color:var(--ink3);white-space:nowrap}
body.timing #say{opacity:0;pointer-events:none}
#say-hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-style:italic;font-size:14px;color:var(--ink3);opacity:0;transition:opacity .3s;pointer-events:none}
#say-hint.on{opacity:1}
#catbtn{position:fixed;right:184px;bottom:50px;width:30px;height:30px;color:var(--ink3);display:grid;place-items:center}
#catbtn:hover{color:var(--ink)}#catbtn svg{width:18px;height:18px}
#catalogue{position:fixed;inset:0;background:var(--veil);z-index:8;opacity:0;pointer-events:none;transition:opacity .45s;overflow-y:auto;scrollbar-width:none}
#catalogue.open{opacity:1;pointer-events:auto}
#catalogue .inner{max-width:860px;margin:120px auto 100px;padding:0 48px}
#catalogue h2{font-weight:400;font-style:italic;font-size:40px}
#cat-q{display:block;width:100%;margin-top:26px;font-style:italic;font-size:20px;padding:6px 0;border-bottom:1px solid var(--ink3)}
#cat-q::placeholder{color:var(--ink3)}
#cat-t{width:100%;border-collapse:collapse;margin-top:18px}
#cat-t td{padding:12px 8px;border-bottom:1px solid var(--hair);font-size:17px;vertical-align:middle}
#cat-t tr.item{cursor:pointer}#cat-t tr.item:hover td{color:var(--ink)}#cat-t tr.item:hover .g{color:var(--ink)}
#cat-t .g{width:40px;color:var(--ink2)}#cat-t .g svg{width:18px;height:18px;display:block}
#cat-t .s{color:var(--ink2);font-style:italic}
#cat-t .c{text-align:right;color:var(--ink3);font-variant-numeric:oldstyle-nums;width:90px}
#cat-t tr.grp td{border:0;padding:40px 8px 8px;font-size:24px;font-style:italic}
#cat-t tr.grp small{font-size:15px;color:var(--ink3);margin-left:14px}


#catbtn,#grid,#theme,#exposure{display:none}
#tools{position:fixed;right:60px;bottom:47px;display:flex;gap:24px;z-index:4}
#tools button{font-size:16px;color:var(--ink2);padding:2px 0;border-bottom:1px solid transparent}
#tools button:hover{color:var(--ink)}#tools button.on{color:var(--ink);border-color:var(--ink3)}
.pop{position:fixed;right:52px;bottom:88px;background:var(--veil);border:1px solid var(--hair);outline:1px solid var(--hair);outline-offset:3px;padding:22px 26px;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .3s,transform .3s;z-index:7}
.pop.open{opacity:1;pointer-events:auto;transform:none}
#legend{width:300px}
#legend h4{font-weight:400;font-size:20px;margin-bottom:12px}
#legend .k{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--ink2);padding:5px 0}
#legend .k svg{width:22px;height:22px;flex:none;color:var(--ink)}
#display{width:380px}
#display .opt{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:15px;color:var(--ink2)}
#display .opt span{display:flex;gap:14px}
#display .opt button{font-size:15px;color:var(--ink3)}#display .opt button:hover{color:var(--ink2)}#display .opt button.on{color:var(--ink);border-bottom:1px solid var(--ink3)}
#cv{transition:opacity .6s}
body.briefing #cv{opacity:.13}
body.briefing #cartouche,body.briefing #observer,body.briefing #hint,body.briefing #say{opacity:0;pointer-events:none}
#brief{position:fixed;left:60px;top:118px;width:min(480px,calc(100vw - 120px));max-height:calc(100vh - 230px);overflow-y:auto;scrollbar-width:none;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .5s,transform .5s;z-index:5}
body.briefing #brief{opacity:1;pointer-events:auto;transform:none}
#brief h2{font-weight:400;font-size:40px;line-height:1.2}
#brief .sub{font-size:17px;color:var(--ink2);margin-top:10px}
#brief h3{font-weight:400;font-size:15px;color:var(--ink3);margin-top:26px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
#brief .it{display:flex;justify-content:space-between;align-items:baseline;gap:18px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--hair);font-size:17px;color:var(--ink)}
#brief .it span{font-size:15px;color:var(--ink3);text-align:right}
#brief .it:hover{color:var(--ink2)}
#brief .it.need{color:var(--accent)}
#brief .foot{display:flex;align-items:center;gap:26px;margin-top:18px;font-size:15px;color:var(--ink3)}
#brief .foot .go{font-size:17px;color:var(--ink);border-bottom:1px solid var(--ink)}
#brief .foot label{display:flex;gap:8px;align-items:center;cursor:pointer}
#brief .foot input{accent-color:var(--ink)}
#hint{position:fixed;left:50%;top:54px;transform:translateX(-50%);font-style:italic;font-size:15px;color:var(--ink3);transition:opacity 1.6s;pointer-events:none}

.note{position:fixed;background:var(--veil);border:1px solid var(--hair);outline:1px solid var(--hair);outline-offset:3px;padding:16px 20px 14px;min-width:180px;max-width:260px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.note.open{opacity:1;pointer-events:auto}
.note h4{font-weight:400;font-style:italic;font-size:19px}
.note p{font-size:15px;line-height:1.6;color:var(--ink2);margin-top:6px}
.note .acts{display:flex;gap:18px;margin-top:12px;font-style:italic;font-size:16px}
.note .acts button{color:var(--ink2)}
.note .acts button:hover{color:var(--ink)}
.note .acts .go{color:var(--accent);border-bottom:1px solid var(--accent)}

#decide{left:50%;bottom:140px;transform:translate(-50%,8px);transition:opacity .4s,transform .4s;text-align:center;padding:22px 30px 18px}
#decide.open{transform:translate(-50%,0)}
#decide .acts{justify-content:center}

#lens{position:fixed;top:0;right:0;bottom:0;width:400px;background:var(--veil);border-left:1px solid var(--hair);padding:110px 48px 56px;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .7s cubic-bezier(.2,.8,.2,1);z-index:6}
#lens.open{transform:none}
#lens .x{position:absolute;top:48px;right:44px;font-size:22px;font-weight:300;color:var(--ink3)}
#lens .x:hover{color:var(--ink)}
#lens .k{font-style:italic;font-size:16px;color:var(--ink3)}
#lens h2{font-weight:300;font-style:italic;font-size:34px;margin-top:10px}
#lens .now{font-size:18px;line-height:1.6;margin-top:22px;color:var(--ink2)}
#log{margin-top:40px;flex:1;min-height:0;overflow:hidden;font-family:var(--mono);font-size:11.5px;line-height:2.25;color:var(--ink2);-webkit-mask-image:linear-gradient(#000 55%,transparent)}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:in .5s ease}
#log b{display:inline-block;width:58px;font-weight:400;color:var(--ink3)}
#log .me{color:var(--accent)}
@keyframes in{from{opacity:0;transform:translateY(-5px)}}
#diff{font-family:var(--mono);font-size:11.5px;line-height:2;margin-top:20px;padding-top:18px;border-top:1px solid var(--hair);color:var(--ink2)}
#diff .a{color:var(--ink)}#diff .d{color:var(--ink3);text-decoration:line-through}
#lens input{margin-top:26px;font-style:italic;font-size:16px;border-bottom:1px solid var(--hair);padding:4px 0}
#lens input::placeholder{color:var(--ink3)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="mark"><b>SwarmJet</b><nav id="crumbs"></nav></div>
<div id="time"><div class="s" id="clock"></div><div class="b" id="big">22:00</div></div>
<div id="hint">把 Issue 拖到中间的主 Agent 上，就是派活</div>
<div id="cartouche"><h1 id="c-title"></h1><p id="c-line"></p></div>

<button id="observer" aria-label="观测者"><svg viewBox="-10 -10 20 20"><circle r="7" fill="none" stroke="currentColor" stroke-width="1"/><circle r="1.6" fill="currentColor"/></svg></button>
<input id="say" placeholder="对主 Agent 说：新任务、问题都可以" autocomplete="off">
<button id="grid" title="经纬线（G）" aria-label="切换经纬线"><svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle r="9"/><ellipse rx="9" ry="3.6"/><ellipse rx="3.6" ry="9"/></svg></button>
<button id="theme" title="切换深浅色（D）" aria-label="切换深浅色"><svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle r="8"/><path d="M0-8A8 8 0 0 1 0 8Z" fill="currentColor"/></svg></button>
<button id="exposure" title="长曝光" aria-label="长曝光"><svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle r="10"/><path d="M-3.5-9.4 4.8 4.9M8.4-4.6-5.4 2M5.1 8.6-1.2-6M-4.8 8.9 3.6-2.6M-9.9.6 4.3 1.6M-.6-10 -3.3 5.6"/></svg></button>

<div class="note" id="note"></div>
<div class="note" id="decide"><h4>PR #8</h4><p>另一位 Agent 验证通过，八项测试全部通过。</p><div class="acts"><button id="later">稍后</button><button class="go" id="merge">合并</button></div></div>

<aside id="lens">
  <button class="x" id="lens-x" aria-label="关闭">×</button>
  <div class="k" id="l-k"></div>
  <h2 id="l-title"></h2>
  <div class="now" id="l-now"></div>
  <div id="log"></div>
  <div id="diff"></div>
  <input id="l-say" placeholder="插一句话">
</aside>

<aside id="almanac" aria-label="项目面板"><button class="sheet-x" id="al-x" aria-label="关闭">×</button>
  <h2 id="al-title"></h2><p class="lead" id="al-lead"></p>
  <h3>方法论</h3><div id="al-method"></div>
  <h3>设置</h3><div id="al-settings"></div>
  <h3>花费</h3><div id="al-fuel"></div>
  <h3>记忆</h3><p class="mute">还没有。Agent 积累下来的经验以后会显示在这里。</p>
</aside>
<section id="appendix" aria-label="平台设置"><button class="sheet-x" id="ap-x" aria-label="关闭">×</button><nav id="ap-nav"><h2>平台设置</h2></nav><div id="ap-body"></div></section>
<div id="tl"><button id="tl-play" title="把这段时间曝光成星轨">曝光</button><div id="tl-track"><b id="tl-handle"></b><div id="tl-ticks"></div></div><button id="tl-now">回到现在</button></div>
<div id="say-hint"></div>
<button id="catbtn" title="列表（C）" aria-label="列表"><svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M-8-9h16v18h-16z M-4-4h8 M-4 0h8 M-4 4h5"/></svg></button>
<div id="catalogue" aria-label="列表"><button class="sheet-x" id="cat-x" aria-label="关闭">×</button><div class="inner"><h2>列表</h2><input id="cat-q" placeholder="查找项目、Agent 或 PR" autocomplete="off"><table id="cat-t"></table></div></div>

/* —— 星系内部：放不下就聚合 —— */
const CAP_PR=9,CAP_SIG=6;
const PRI_PR={ready:4,reviewing:3,open:2,stale:1};
const prPri=b=>PRI_PR[b.state==='ready'?'ready':B.some(m=>m.kind==='moon'&&m.pr===b.id)?'reviewing':b.st||'open'];
function layoutSys(s){B=B.filter(b=>!(b.kind==='cluster'&&b.sys===s));
  const prs=B.filter(b=>b.sys===s&&b.kind==='pr'&&b.state!=='merging').sort((a,b)=>prPri(b)-prPri(a));
  if(prs.length>CAP_PR){const keep=prs.slice(0,CAP_PR-1),rest=prs.slice(CAP_PR-1),n=CAP_PR;
    keep.forEach((b,i)=>{b.hidden=false;b.ang=.15+i*TAU/n});rest.forEach(b=>b.hidden=true);
    add({id:s.id+':cpr',sys:s,kind:'cluster',of:'pr',ang:.15+(n-1)*TAU/n,items:rest,label:`还有 ${rest.length} 个 PR`})}
  else prs.forEach(b=>b.hidden=false);
  const sig=B.filter(b=>b.sys===s&&b.kind==='signal'&&!b.ci).sort((a,b)=>(a.claimed-b.claimed)||(a.ang-b.ang));
  if(sig.length>CAP_SIG){const keep=sig.slice(0,CAP_SIG-1),rest=sig.slice(CAP_SIG-1);
    keep.sort((a,b)=>a.ang-b.ang).forEach((b,i)=>{b.hidden=false;b.ang=3.05+i*.2});rest.forEach(b=>b.hidden=true);
    add({id:s.id+':csig',sys:s,kind:'cluster',of:'signal',ang:3.05+(CAP_SIG-1)*.2,items:rest,label:`还有 ${rest.length} 个 Issue`})}
  else sig.forEach(b=>b.hidden=false)}

/* —— 历史繁星：做完的事散在星系最外层 —— */
const hh=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>16;h=Math.imul(h,2246822507);h^=h>>>13;h=Math.imul(h,3266489909);h^=h>>>16;return(h>>>0)/4294967296};
const H_IN=R_SIG+70,H_OUT=760,H_CAP=500;
/* 内缘紧贴 Issue 外圈，向外按指数变稀，最远到 H_OUT；扁度和星系一致，略厚一点 */
function histPos(s,id){const a=hh(id+':a')*TAU,u=hh(id+':r'),r=Math.min(H_OUT,H_IN+(H_OUT-H_IN)*(-Math.log(1-u*.97))/3.2),c=Math.cos(a)*r,d=Math.sin(a)*r*(AS+.12);
  return{x:s.x+c*Math.cos(TILT)-d*Math.sin(TILT),y:s.y+c*Math.sin(TILT)+d*Math.cos(TILT)}}
const H_TITLES=['feat: add --lines flag to wordcount','修复空文件时的除零错误','docs: README usage for --bytes','fix: handle CRLF line endings in count_lines','test: subprocess tests for missing file','refactor: extract argv parsing into parse_args()','支持从标准输入读取','chore: pin python to 3.12 in CI','feat: JSON output mode','fix: exit code 2 on unreadable file','Implement RFC 4180 CSV parsing utility','Implement canonical JSON signatures per RFC 8785','Implement IDNA2008 domain conversion','feat(api): cursor pagination for /v1/projects','fix: race in token bucket refill','perf: avoid N+1 query in project list','docs: 部署指南补充反向代理配置','fix: 时区导致的日报统计偏差','feat: retry with jitter for outbound webhooks','chore: drop Go 1.22 support'];
function genHist(s,n){const H=[];for(let i=0;i<n;i++){const u=rnd(),out=u<.46?'merged':u<.8?'done':u<.92?'cancelled':'failed';
    const age=rnd()<.7?-Math.log(1-rnd())*60:rnd()*24*60;const id=s.id+':h'+i;
    H.push(Object.assign({id,sys:s,kind:'hist',out,age,title:H_TITLES[Math.floor(rnd()*H_TITLES.length)]+(rnd()<.3?'，并补充测试与文档说明，保持现有行为不变':'')},histPos(s,id)))}
  H.sort((a,b)=>a.age-b.age);let k=0;for(const h of H){if(h.out==='cancelled')continue;h.dust=++k>H_CAP}return H}
SYS.forEach(s=>s.hist=genHist(s,{docs:70,tfm:260,api:900}[s.id]));

function place(){
  const qi={};
  for(const b of B){const s=b.sys;
    if(b.kind==='comet'&&b.state==='leaving'){const v=b.lv;v.t=Math.min(1,v.t+.003*speed);const e=ease(v.t);b.x=v.fx+(v.h.x-v.fx)*e;b.y=v.fy+(v.h.y-v.fy)*e;b.alpha=1-.45*e;
      if(v.t>=1){b.dead=true;v.h.pending=false;v.h.glint=.001}continue}
    if(b.kind==='cluster'){b.ang+=.00035*speed;const p=ell(s.x,s.y,b.ang,b.of==='pr'?R_PR:R_SIG);b.x=p.x;b.y=p.y;continue}
    if(b.kind==='comet'){if(b.state==='busy'||b.state==='done')b.a+=b.speed*speed;let p=ell(s.x,s.y,b.a,b.r);
      if(b.born<1){b.born=Math.min(1,b.born+.01*speed);const e=ease(b.born);p={x:s.x+(p.x-s.x)*e,y:s.y+(p.y-s.y)*e}}b.x=p.x;b.y=p.y}
    else if(b.kind==='pr'){if(b.state==='merging'){b.mt+=.0075*speed;b.ang+=.045*speed;const p=ell(s.x,s.y,b.ang,R_PR*(1-ease(clamp(b.mt,0,1))));b.x=p.x;b.y=p.y;
        if(b.mt>=1){b.dead=true;flares.push({sys:s,t:0});onMerged(b)}}
      else{b.ang+=.00035*speed;const p=ell(s.x,s.y,b.ang,R_PR);b.x=p.x;b.y=p.y;if(b.grow<1)b.grow=Math.min(1,b.grow+.015*speed)}}
    else if(b.kind==='moon'){const h=get(b.pr);if(!h){b.dead=true;continue}b.a+=.03*speed;b.x=h.x+Math.cos(b.a)*15;b.y=h.y+Math.sin(b.a)*15*.6}
    else if(b.kind==='signal'){const p=ell(s.x,s.y,b.ang,R_SIG);b.x=p.x+b.dx;b.y=p.y+b.dy;if(drag!==b){b.dx*=.86;b.dy*=.86}}
    else if(b.kind==='queue'){const i=qi[s.id]=(qi[s.id]??-1)+1;const p=ell(s.x,s.y,-1.75-i*.09,R_HELIO);b.x=p.x;b.y=p.y}}
  B=B.filter(b=>!b.dead);
  const r=$('observer').getBoundingClientRect(),w=toW(r.left+r.width/2,r.top+r.height/2);you.x=w.x;you.y=w.y;
}

function routes(s){const R=[];if(!s.on)return R;const st=s.star;
  for(const b of B){if(b.sys!==s||b.born<1)continue;
    if(b.kind==='signal'&&b.claimed&&!b.hidden)R.push([b,st]);
    if(b.kind==='comet'&&b.state==='busy'){R.push([st,b],[b,st]);const t=b.target&&get(b.target);if(t&&!t.hidden)R.push([b,t])}
    if(b.kind==='moon'){R.push([b,st]);const h=get(b.pr);if(h)R.push([h,b])}}
  return R}

function drawFrame(){const m=26,i=6;ctx.globalAlpha=1;ctx.strokeStyle=P.hair;ctx.lineWidth=1*P.lw;ctx.strokeRect(m+.5,m+.5,W-2*m-1,H-2*m-1);ctx.strokeRect(m+i+.5,m+i+.5,W-2*(m+i)-1,H-2*(m+i)-1);
  const o=m+i,step=P.tick;ctx.beginPath();
  for(let x=o+step,k=1;x<W-o;x+=step,k++){const L=k%5?3:7;ctx.moveTo(x+.5,o);ctx.lineTo(x+.5,o+L);ctx.moveTo(x+.5,H-o);ctx.lineTo(x+.5,H-o-L)}
  for(let y=o+step,k=1;y<H-o;y+=step,k++){const L=k%5?3:7;ctx.moveTo(o,y+.5);ctx.lineTo(o+L,y+.5);ctx.moveTo(W-o,y+.5);ctx.lineTo(W-o-L,y+.5)}
  ctx.stroke();
  if(false){ctx.fillStyle=P.ink3;ctx.font=`300 9px ${MONO}`;ctx.textAlign='center';const off=((cam.x*cam.s)%(step*5)+step*5)%(step*5);
  for(let x=o+step*5,k=1;x<W-o-20;x+=step*5,k++){ctx.globalAlpha=.8;ctx.fillText(String((k*15+Math.round(cam.x/40))%360).padStart(3,'0'),x,o-9)}}}

function draw(){
  frame++;
  if(!(cam.s>0)||!isFinite(cam.s))cam.s=cam.ts>0?cam.ts:.3;

  for(const st of stars){if(P.simple&&st.r<1.15)continue;const x=(st.x-cam.x*.35)*Math.max(.35,s*.55)+W/2,y=(st.y-cam.y*.35)*Math.max(.35,s*.55)+H/2;if(x<0||y<0||x>W||y>H)continue;

    for(let k=0;k<12;k++){const a=k*TAU/12;ctx.beginPath();ctx.moveTo(c.x+Math.cos(a)*420*s,c.y+Math.sin(a)*420*s*.62);ctx.lineTo(c.x+Math.cos(a)*2600*s,c.y+Math.sin(a)*2600*s*.62);ctx.stroke()}}

  for(const t of trails){const c=toS(t.sys.x,t.sys.y);ctx.globalAlpha=t.al*(t.sys.dim??1);ctx.strokeStyle=P.ink2;ctx.lineWidth=.9*P.lw;ctx.setLineDash([1,3]);ctx.beginPath();ctx.ellipse(c.x,c.y,t.r*s,t.r*AS*s,TILT,t.a0,t.a1);ctx.stroke();ctx.setLineDash([]);t.al=Math.max(.16,t.al-.0008)}

function drawStar(sy){const c=toS(sy.x,sy.y),s=cam.s,r=Math.max(9*s,3.5),d=sy.dim;ctx.globalAlpha=d;

    const t=b.target&&get(b.target);if(t&&t.kind==='pr'&&b.state!=='done'){const q=toS(t.x,t.y);ctx.globalAlpha=d*.35;ctx.strokeStyle=P.ink2;ctx.lineWidth=.6*P.lw;ctx.setLineDash([1,4]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.setLineDash([])}}

function recordExposure(){ex.globalAlpha=1;for(const b of B){if(b.alpha<=0||(b.sys.dim??1)<.5)continue;const p=toS(b.x,b.y);

  '账簿':()=>{const t=SYS.map(sy=>[sy.name,INFO[sy.id].week]),mx=Math.max(...t.map(x=>x[1]));return `<h3>账簿</h3><p>本周所有项目一共花费 ${money(t.reduce((a,x)=>a+x[1],0))}。</p>`+
    t.map(([n,v])=>`<div class="row" style="display:block">${n}<span style="float:right">${money(v)}</span><div class="bar" style="width:${v/mx*100}%"></div></div>`).join('')},
  '账号':()=>`<h3>账号</h3><p>这是一套单管理员部署。</p><div class="row">管理员<span>admin</span></div><div class="row">本次登录<span>今天 00:12，来自本机</span></div><div class="acts"><button>退出登录</button></div>`};
function apShow(k){$('ap-body').innerHTML=AP[k]();$('ap-nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.textContent===k))}
Object.keys(AP).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>apShow(k);$('ap-nav').appendChild(b)});
function openAppendix(k='接入'){hideNote();closeCatalogue();closeTimeline();$('decide').classList.remove('open');apShow(k);$('appendix').classList.add('open')}
function closeAppendix(){$('appendix').classList.remove('open')}
$('ap-x').onclick=closeAppendix;$('mark').querySelector('b').onclick=()=>openAppendix();

const STATUS=b=>b.kind==='star'?(b.sys.on?'正在照看这个项目':'已停用'):b.kind==='comet'?(b.stale?'空闲 18 小时，仍占着名额':{busy:'工作中',parked:'空闲',failed:'失败',done:'已完成'}[b.state]):b.kind==='moon'?'正在验证':b.kind==='pr'?({ready:'等你决定',merging:'正在合并'}[b.state]||'等待验证'):b.kind==='signal'?(b.ci?'外部检查':b.claimed?'已被认领':'无人认领'):'排队中';
const GLY={star:'<circle r="4.5" fill="currentColor"/>',busy:'<circle r="3" fill="currentColor"/><path d="M3 -1.5l7 -3M3 0l8 -1.5M3 1.5l7 0" stroke="currentColor" stroke-width=".8"/>',parked:'<circle r="3" fill="none" stroke="currentColor"/><path d="M4.5 -1.5l5 -2" stroke="currentColor" stroke-dasharray="1.5 1.5"/>',
  failed:'<path d="M-3.5 -3.5l7 7M3.5 -3.5l-7 7" stroke="currentColor"/>',moon:'<ellipse rx="7" ry="4" fill="none" stroke="currentColor" stroke-dasharray="1 1.5"/><circle cx="7" r="1.8" fill="currentColor"/>',
  pr:'<ellipse rx="9" ry="2.6" transform="rotate(-20)" fill="none" stroke="currentColor"/><circle r="4" fill="var(--paper)" stroke="currentColor"/>',signal:'<path d="M-5 0h10M0 -5v10" stroke="currentColor"/>',ci:'<path d="M0 -5l5 5-5 5-5-5z" fill="none" stroke="currentColor"/>',queue:'<circle r="3" fill="none" stroke="currentColor"/>'};
const glyph=b=>`<svg viewBox="-12 -12 24 24">${GLY[b.kind==='comet'?(b.state==='busy'||b.state==='done'?'busy':b.state):b.kind==='signal'&&b.ci?'ci':b.kind]}</svg>`;
function renderCatalogue(){const q=$('cat-q').value.trim().toLowerCase();let h='';
  for(const sy of [...SYS].sort((a,b)=>(needs.some(n=>n.sys===b.id)-needs.some(n=>n.sys===a.id))||(b.on-a.on))){const items=[sy.star,...B.filter(b=>b.sys===sy&&b.alpha>0&&b.kind!=='cluster'&&b.state!=='leaving')];const rows=items.filter(b=>!q||(b.label+sy.name+STATUS(b)).toLowerCase().includes(q));if(!rows.length)continue;
    h+=`<tr class="grp"><td colspan="4">${sy.name}<small>${sy.method}，今天 ${money(INFO[sy.id].today)}</small></td></tr>`;
    rows.forEach(b=>{const i=items.indexOf(b);h+=`<tr class="item" data-s="${sy.id}" data-i="${i}"><td class="g">${glyph(b)}</td><td>${b.kind==='queue'?'等待中的请求':b.title?b.label+'  '+short(b.title,26):b.label}</td><td class="s">${STATUS(b)}</td><td class="c">${b.kind==='comet'||b.kind==='moon'?money(.01+((b.r||60)%7)/100):''}</td></tr>`})}
  for(const sy of SYS){const n=sy.hist.filter(x=>x.out!=='cancelled').length,w=sy.hist.filter(x=>x.out!=='cancelled'&&x.age<168).length;if(n&&!q)h+=`<tr><td></td><td class="s" colspan="3">${sy.name}：历史做完 ${n} 件，最近 7 天 ${w} 件</td></tr>`}
  $('cat-t').innerHTML=h||'<tr><td class="s">没有找到。</td></tr>';
  $('cat-t').querySelectorAll('tr.item').forEach(tr=>tr.onclick=()=>{const sy=S[tr.dataset.s],items=[sy.star,...B.filter(b=>b.sys===sy&&b.alpha>0&&b.kind!=='cluster'&&b.state!=='leaving')],b=items[+tr.dataset.i];closeCatalogue();flyTo(b)})}
function openCatalogue(){hideNote();closeAppendix();$('cat-q').value='';renderCatalogue();$('catalogue').classList.add('open');setTimeout(()=>$('cat-q').focus(),50)}
function closeCatalogue(){$('catalogue').classList.remove('open');$('cat-q').blur()}
$('cat-q').addEventListener('input',renderCatalogue);$('cat-x').onclick=closeCatalogue;$('catbtn').onclick=openCatalogue;
function flyTo(b){const go=()=>{if(b.kind==='comet'||b.kind==='moon')lens(b);else if(b.kind==='star'){sel=b;note(b)}else note(b)};if(mode==='cosmos'||b.sys!==focus){goSys(b.sys);setTimeout(go,700)}else go()}

const pad=n=>String(n).padStart(2,'0'),hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),timeAt=f=>new Date(Date.now()-(1-f)*864e5);
let prevSpeed=1;
function setPast(f){pastF=clamp(f,0,1);$('tl-handle').style.left=(pastF*100)+'%';
  if(pastF<.999){if(speed>0)prevSpeed=speed;speed=0;$('time').classList.add('on');$('big').textContent=hhmm(timeAt(pastF))}
  else{pastF=1;speed=prevSpeed||1;$('time').classList.remove('on');ex.clearRect(0,0,W,H);expAlpha=0}}
function drawPast(){ex.clearRect(0,0,W,H);let sd=9173;const r2=()=>(sd=(sd*16807)%2147483647)/2147483647,n=Math.floor((1-pastF)*130);
  ex.strokeStyle=P.ink;ex.lineWidth=.8;for(let i=0;i<n;i++){const sy=r2()<.62?T:A,c=toS(sy.x,sy.y),rr=118+r2()*62,a0=r2()*TAU,len=.25+r2()*2;ex.globalAlpha=.26;ex.beginPath();ex.ellipse(c.x,c.y,rr*cam.s,rr*AS*cam.s,TILT,a0,a0+len);ex.stroke()}expAlpha=1}
function renderTicks(){$('tl-ticks').innerHTML=[0,.25,.5,.75].map(f=>`<span style="left:${f*100}%">${hhmm(timeAt(f))}</span>`).join('')}
function openTimeline(){if(replay)return;tlOpen=true;renderTicks();setPast(1);document.body.classList.add('timing');$('tl').classList.add('open')}
function closeTimeline(){if(!tlOpen)return;tlOpen=false;setPast(1);document.body.classList.remove('timing');$('tl').classList.remove('open')}
function toggleTimeline(){tlOpen?closeTimeline():openTimeline()}
$('exposure').onclick=toggleTimeline;$('exposure').title='时间（T）';
let tlDrag=false;const tlAt=e=>{const r=$('tl-track').getBoundingClientRect();setPast((e.clientX-r.left)/r.width)};
$('tl-track').addEventListener('pointerdown',e=>{tlDrag=true;$('tl-track').setPointerCapture(e.pointerId);tlAt(e)});
$('tl-track').addEventListener('pointermove',e=>{if(tlDrag)tlAt(e)});$('tl-track').addEventListener('pointerup',()=>tlDrag=false);
$('tl-now').onclick=()=>setPast(1);
$('tl-play').onclick=()=>{const f=pastF<.999?pastF:0,d=timeAt(f),m0=d.getHours()*60+d.getMinutes(),span=Math.round((1-f)*1440);closeTimeline();startReplay(m0,span)};

function route(v){const q=v.toLowerCase().replace(/\s/g,'');if(q.length>14)return null;
  const sy=SYS.find(x=>q.includes(x.name.toLowerCase()));if(sy)return{label:'前往 '+sy.name,go:()=>{closeAppendix();goSys(sy)}};
  const m=v.match(/pr\s*#?\s*(\d+)/i)||v.match(/#(\d+)/);if(m){const b=B.find(b=>(b.kind==='pr'&&b.label==='PR #'+m[1])||(b.kind==='comet'&&b.label.endsWith('#'+m[1])));if(b)return{label:'前往 '+b.label,go:()=>flyTo(b)}}
  const ap=[['模型','模型'],['凭证','模型'],['接入','接入'],['github','接入'],['隧道','接入'],['webhook','接入'],['连接','连接'],['mcp','连接'],['令牌','连接'],['账簿','账簿'],['账号','账号'],['退出','账号'],['设置','接入'],['平台','接入']].find(([k])=>q.includes(k));
  if(ap)return{label:'打开平台设置里的'+ap[1],go:()=>openAppendix(ap[1])};
  if(/方法论|项目设置|花费|用量|项目面板/.test(q))return{label:'打开项目面板',go:()=>{if(mode==='cosmos')goSys(T);setTimeout(openAlmanac,mode==='cosmos'?600:0)}};
  if(/列表|星表|目录/.test(q))return{label:'打开列表',go:openCatalogue};
  if(/时间|回放|昨夜/.test(q))return{label:'打开时间轴',go:openTimeline};
  return null}
function sayHint(t){$('say-hint').textContent=t;$('say-hint').classList.toggle('on',!!t)}
$('say').addEventListener('input',e=>{const v=e.target.value.trim();if(!v)return sayHint('');const rt=route(v);sayHint(rt?'回车'+rt.label:'回车发给主 Agent')});
$('say').addEventListener('blur',()=>sayHint(''));

function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
function applyStyle(v){if(v==='simple')document.documentElement.dataset.style='simple';else delete document.documentElement.dataset.style;palette();syncDisplay()}
function setTheme(v){themeChoice=v;store('sj-theme',v==='system'?undefined:v);applyThemeVars();palette();syncDisplay()}
$('theme-opts').innerHTML=Object.entries(THEMES).map(([k,t])=>`<button data-theme="${k}">${t.label}</button>`).join('')+'<button data-theme="system">跟随系统</button>';
function syncDisplay(){const st=document.documentElement.dataset.style==='simple'?'simple':'classic',th=themeChoice;
  $('display').querySelectorAll('[data-style]').forEach(b=>b.classList.toggle('on',b.dataset.style===st));
  $('display').querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===th));
  $('display').querySelectorAll('[data-grid]').forEach(b=>b.classList.toggle('on',(b.dataset.grid==='on')===gridOn()))}
$('display').querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{store('sj-style',b.dataset.style);applyStyle(b.dataset.style)});
$('display').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
$('display').querySelectorAll('[data-grid]').forEach(b=>b.onclick=()=>{if((b.dataset.grid==='on')!==gridOn())toggleGrid();syncDisplay()});
function pop(id){const el=$(id),open=!el.classList.contains('open');['legend','display'].forEach(x=>{$(x).classList.remove('open');$('t-'+x).classList.remove('on')});if(open){el.classList.add('open');$('t-'+id).classList.add('on')}}
$('t-legend').onclick=()=>pop('legend');$('t-display').onclick=()=>{syncDisplay();pop('display')};
$('t-list').onclick=openCatalogue;$('t-time').onclick=toggleTimeline;$('t-brief').onclick=()=>briefOpen()?closeBrief():openBrief();
const LEG=[['star','主 Agent，每个项目中间的那颗'],['hist','做完的事，散在最外层；越亮越新'],['cluster','放不下的 PR 或 Issue，点开看全部'],['busy','工作中的 Agent，尾巴越长越忙'],['parked','空闲的 Agent'],['failed','失败的 Agent'],['pr','PR'],['ready','等你决定的 PR'],['moon','正在验证 PR 的 verifier'],['signal','GitHub 上的 Issue'],['queue','排队等待的任务'],['you','你']];
const LGLY=Object.assign({},GLY,{hist:'<circle r="1.6" fill="currentColor"/><path d="M-5 0h10M0 -5v10" stroke="currentColor" stroke-width=".5"/>',cluster:'<circle r="2.6" cx="-3.5" fill="none" stroke="currentColor"/><circle r="2.6" cx="3" cy="-1.5" fill="none" stroke="currentColor"/><circle r="2.6" cy="3" fill="none" stroke="currentColor"/>',ready:GLY.pr+'<circle r="9" fill="none" stroke="var(--accent)" stroke-dasharray="2 2"/>',you:'<circle r="7" fill="none" stroke="currentColor"/><circle r="1.6" fill="currentColor"/>'});
$('legend-k').innerHTML=LEG.map(([k,t])=>`<div class="k"><svg viewBox="-12 -12 24 24">${LGLY[k]}</svg>${t}</div>`).join('');
const briefOpen=()=>document.body.classList.contains('briefing');
function renderBrief(){const allBusy=B.filter(b=>b.kind==='comet'&&b.state==='busy'&&b.sys.on),busy=allBusy.slice(0,3),need=needs.length;
  $('b-title').textContent=need?'有一件事需要你。':'一切正常，不需要你做什么。';
  $('b-sub').textContent=`${SYS.length} 个项目里有 ${B.filter(b=>b.kind==='comet'&&b.state==='busy').length+B.filter(b=>b.kind==='moon').length} 个 Agent 正在工作。`;
  let h='';if(need)h+=`<h3>需要你</h3><button class="it need" data-go="t:pr8">PR #8 可以合并了<span>test-for-myself，另一位 Agent 已验证通过</span></button>`;
  h+=`<h3>正在进行</h3>`+busy.map(b=>`<button class="it" data-go="${b.id}">${b.label} ${b.short||'工作中'}<span>${b.sys.name}</span></button>`).join('')+(allBusy.length>3?`<button class="it" data-list="1">还有 ${allBusy.length-3} 个<span>在列表里查看</span></button>`:'');
  h+=`<h3>需要留意</h3><button class="it" data-go="d:c0">docs-site 的模型凭证失效了<span>worker #2 连续三次失败</span></button><button class="it" data-go="t:w3">worker #3 空闲了 18 小时<span>仍占着一个名额</span></button>`;
  h+=`<h3>昨晚完成</h3><button class="it" data-replay="1">合并了 6 个 PR，处理了 9 个 Issue<span>花费 $1.27，回放一下</span></button>`;
  $('b-body').innerHTML=h;
  $('b-body').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{const b=get(x.dataset.go);closeBrief();if(b)flyTo(b)});
  $('b-body').querySelectorAll('[data-list]').forEach(x=>x.onclick=()=>{closeBrief();openCatalogue()});
  $('b-body').querySelectorAll('[data-replay]').forEach(x=>x.onclick=()=>{closeBrief();if(mode==='cosmos')goSys(T);setTimeout(()=>startReplay(),700)})}
function openBrief(){renderBrief();hideNote();closeLens();closeAlmanac();document.body.classList.add('briefing');$('t-brief').classList.add('on')}
function closeBrief(){if(!briefOpen())return;document.body.classList.remove('briefing');$('t-brief').classList.remove('on');if(!read('sj-legend-seen')){store('sj-legend-seen','1');setTimeout(()=>{pop('legend');setTimeout(()=>{if($('legend').classList.contains('open'))pop('legend')},7000)},900)}}
$('b-enter').onclick=()=>{closeBrief();if(mode==='cosmos')goSys(T)};
$('b-skip').onchange=e=>store('sj-brief',e.target.checked?'off':undefined);

function clock(){const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
clock();setInterval(clock,15000);
setTimeout(()=>$('hint').style.opacity=0,7000);
if(read('sj-style')==='simple')applyStyle('simple');syncDisplay();
cam.s=cam.ts=cosmosScale()*.8;goCosmos();if(read('sj-brief')!=='off'){$('b-skip').checked=false;openBrief()}else{$('b-skip').checked=true}$('observer').classList.add('wait');
setTimeout(()=>{if(mode==='cosmos'&&!briefOpen())goSys(T)},2800);
draw();
</script>
</body>
