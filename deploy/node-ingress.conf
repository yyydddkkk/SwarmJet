server {
    listen ${NODE_INGRESS_LISTEN_IP}:8180;
    server_name _;
    server_tokens off;

    location = /healthz {
        allow ${NODE_INGRESS_ALLOWED_IP};
        deny all;
        proxy_pass http://127.0.0.1:8181;
    }

    location = /api/nodes {
        limit_except POST { deny all; }
        allow ${NODE_INGRESS_ALLOWED_IP};
        deny all;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:8181;
    }

    location / { return 404; }
}
