server {
    listen 192.0.2.121:8180;
    server_name _;
    server_tokens off;

    location = /healthz {
        allow 192.0.2.192;
        deny all;
        proxy_pass http://127.0.0.1:8181;
    }

    location = /api/nodes {
        limit_except POST { deny all; }
        allow 192.0.2.192;
        deny all;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:8181;
    }

    location / { return 404; }
}
