# Overlay for running Forager Cells inside the serve process.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.cells.yaml up -d
#
# This mounts the host Docker socket into serve. That is root-equivalent on the
# host, so only add this file on a server whose administrators are trusted.
services:
  api:
    environment:
      SWARMJET_CELLS: '1'
      # The cell must join the same network as serve to reach its /mcp.
      SWARMJET_CELL_NETWORK: ${SWARMJET_CELL_NETWORK:-${COMPOSE_PROJECT_NAME:-swarmjet}_default}
      # The API is the only caller of the broker and gateway. install.py
      # writes both bearer token files under DATA_DIR/omp with mode 0600.
      SWARMJET_DEFAULT_MODEL: ${SWARMJET_DEFAULT_MODEL:-deepseek/deepseek-v4-flash}
      SWARMJET_LLM_GATEWAY_URL: ${SWARMJET_LLM_GATEWAY_URL:-http://auth-gateway:8766}
      SWARMJET_AUTH_BROKER_URL: ${SWARMJET_AUTH_BROKER_URL:-http://auth-broker:8765}
      SWARMJET_OMP_CONFIG_DIR: ${DATA_DIR:?Set absolute DATA_DIR}/omp
    networks:
      default:
        aliases:
          - swarmjet
      llm: {}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path as the host and writable: Cell workspaces live below
      # DATA_DIR. Compose merges this entry with the base one by target, so the
      # final service has one DATA_DIR mount and it is writable.
      - type: bind
        source: ${DATA_DIR:?Set absolute DATA_DIR}
        target: ${DATA_DIR:?Set absolute DATA_DIR}

  # omp's credential vault. It is reachable only on the dedicated llm network:
  # no ports are published and the api is the only client.
  auth-broker:
    image: ${AGENT_IMAGE:-swarmjet-agent:local}
    restart: unless-stopped
    # The Agent image's entrypoint is bash; run the omp binary directly.
    entrypoint: ["/usr/local/bin/omp"]
    command: ["auth-broker", "serve", "--bind=0.0.0.0:8765"]
    environment:
      # omp treats PI_CONFIG_DIR as a dirname under HOME, so point HOME at
      # DATA_DIR and keep the actual config root at DATA_DIR/omp.
      HOME: ${DATA_DIR:?Set absolute DATA_DIR}
      PI_CONFIG_DIR: omp
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set absolute DATA_DIR}/omp
        target: ${DATA_DIR:?Set absolute DATA_DIR}/omp
    networks:
      llm: {}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8765/v1/healthz]
      interval: 10s
      timeout: 3s
      retries: 12

  # Forward proxy that resolves broker credentials and calls the model provider.
  # The api reaches it at SWARMJET_LLM_GATEWAY_URL; Cells are not on this
  # network and can never resolve it.
  auth-gateway:
    image: ${AGENT_IMAGE:-swarmjet-agent:local}
    restart: unless-stopped
    # The Agent image's entrypoint is bash; run the omp binary directly.
    entrypoint: ["/usr/local/bin/omp"]
    command: ["auth-gateway", "serve", "--bind=0.0.0.0:8766"]
    depends_on:
      auth-broker:
        condition: service_healthy
    environment:
      HOME: ${DATA_DIR:?Set absolute DATA_DIR}
      PI_CONFIG_DIR: omp
      OMP_AUTH_BROKER_URL: http://auth-broker:8765
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set absolute DATA_DIR}/omp
        target: ${DATA_DIR:?Set absolute DATA_DIR}/omp
    networks:
      llm: {}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8766/healthz]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  # Only the api joins this network; Cells stay on the default network and
  # cannot even resolve auth-broker/auth-gateway. The network is not marked
  # internal so the gateway can still reach model providers through Docker NAT.
  llm: {}
