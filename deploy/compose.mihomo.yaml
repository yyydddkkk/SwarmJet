# Optional overlay: add after compose.yaml / compose.builder.yaml.
# No Docker socket, TUN device or NET_ADMIN capability is required.
services:
  api:
    environment:
      MIHOMO_ADMIN_URL: http://mihomo:8095
      MIHOMO_ADMIN_SECRET: ${MIHOMO_ADMIN_SECRET:?Set a separate random admin secret}
  mihomo:
    image: ${MIHOMO_SERVICE_IMAGE:-swarmjet-mihomo:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mihomo
      args:
        SWARMJET_IMAGE: ${IMAGE:-swarmjet:local}
        MIHOMO_IMAGE: ${MIHOMO_IMAGE:-metacubex/mihomo:v1.19.31}
    command: [mihomo]
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 192
    mem_limit: 1g
    cpus: 1
    environment:
      SWARMJET_MASTER_KEY: ${SWARMJET_MASTER_KEY:?Set the stable master key}
      MIHOMO_ADMIN_SECRET: ${MIHOMO_ADMIN_SECRET:?Set a separate random admin secret}
      MIHOMO_DATA_DIR: /var/lib/swarmjet-mihomo
      MIHOMO_RUNTIME_DIR: /run/mihomo
      MIHOMO_ADMIN_LISTEN: :8095
      MIHOMO_PROXY_LISTEN: :7890
      MIHOMO_PUBLIC_URL: ${MIHOMO_PUBLIC_URL:-http://127.0.0.1:17890}
    ports:
      - '${MIHOMO_BIND_HOST:-127.0.0.1}:${MIHOMO_PORT:-17890}:7890'
    volumes:
      - mihomo-state:/var/lib/swarmjet-mihomo
    tmpfs:
      - /run/mihomo:mode=0700,size=512m
      - /tmp:mode=1777,size=64m
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8095/healthz]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  mihomo-state:
