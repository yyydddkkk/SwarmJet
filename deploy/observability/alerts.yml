# These are direct failure/backlog signals. The 2-minute hold avoids transient
# startup/scrape noise; no task SLO or capacity threshold is claimed here.
groups:
  - name: swarmjet-baseline
    rules:
      - alert: SwarmJetScrapeTargetDown
        expr: up{job=~"swarmjet-api|swarmjet-worker|temporal|postgres"} == 0
        for: 2m
        labels:
          severity: warning
          evidence: direct_scrape_failure
        annotations:
          summary: 'Metrics scrape failed for {{ $labels.job }}'
          description: 'Check the target and its network path; a failed scrape alone does not identify the underlying cause.'
      - alert: SwarmJetPostgresUnavailable
        expr: pg_up{job="postgres"} == 0
        for: 2m
        labels:
          severity: warning
          evidence: exporter_connection_failure
        annotations:
          summary: PostgreSQL exporter cannot connect to the database
      - alert: SwarmJetStateSnapshotFailed
        expr: swarmjet_state_snapshot_success == 0
        for: 2m
        labels:
          severity: warning
          evidence: application_query_failure
        annotations:
          summary: SwarmJet backlog snapshot failed
          description: 'Backlog gauges retain their last values while this is firing.'
      # The holds below are dev investigation thresholds, not production SLOs.
      - alert: SwarmJetCommandBacklog
        expr: swarmjet_command_pending > 0 and swarmjet_command_oldest_wait_seconds > 60
        for: 5m
        labels:
          severity: warning
          evidence: postgres_command_age
          threshold_status: provisional_dev
        annotations:
          summary: PostgreSQL has old undelivered commands
      - alert: SwarmJetAdmissionWaiting
        expr: swarmjet_admission_waiting > 0 and swarmjet_admission_oldest_wait_seconds > 300
        for: 5m
        labels:
          severity: warning
          evidence: postgres_admission_age
          threshold_status: provisional_dev
        annotations:
          summary: A task has waited more than five minutes for admission
      - alert: SwarmJetActivityFailures
        expr: increase(swarmjet_activity_steps_total{result="error"}[10m]) > 0
        labels:
          severity: warning
          evidence: application_activity_failure
          threshold_status: provisional_dev
        annotations:
          summary: 'Task Activity {{ $labels.phase }} failed in the last ten minutes'
