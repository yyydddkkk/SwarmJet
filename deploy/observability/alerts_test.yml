rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="swarmjet-api"}'
        values: '0+0x5'
      - series: 'pg_up{job="postgres"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: SwarmJetScrapeTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              evidence: direct_scrape_failure
              job: swarmjet-api
            exp_annotations:
              summary: Metrics scrape failed for swarmjet-api
              description: Check the target and its network path; a failed scrape alone does not identify the underlying cause.
      - eval_time: 3m
        alertname: SwarmJetPostgresUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="postgres"}'
        values: '1+0x5'
      - series: 'pg_up{job="postgres"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: SwarmJetPostgresUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              evidence: exporter_connection_failure
            exp_annotations:
              summary: PostgreSQL exporter cannot connect to the database
