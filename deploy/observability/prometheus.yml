global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: swarmjet-api
    static_configs:
      - targets: ['api:9090']
  - job_name: swarmjet-worker
    static_configs:
      - targets: ['worker:9090']
  - job_name: temporal
    static_configs:
      - targets: ['temporal:8000']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
