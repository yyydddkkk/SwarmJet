# Execution node for distributed mode. Run on a host with its own DATA_DIR and
# Docker. It does not need PostgreSQL or Temporal; it registers with the
# control-plane API and receives work over the authenticated node protocol.
#
#   cd deploy
#   docker compose -f compose.node.yaml up -d
#
# NODE_ADVERTISE_URL must be reachable from the control plane. Use TLS in
# production and use the per-node NODE_SECRET from Node management.
name: ${COMPOSE_PROJECT_NAME:-swarmjet}-node
services:
  node:
    image: ${IMAGE:-swarmjet:local}
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: '5'}
    command: [node]
    environment:
      DATA_DIR: ${NODE_DATA_DIR:?Set NODE_DATA_DIR to an absolute host path}
      NODE_ID: ${NODE_ID:?Set NODE_ID}
      NODE_SECRET: ${NODE_SECRET:?Set NODE_SECRET with at least 32 characters}
      NODE_ADVERTISE_URL: ${NODE_ADVERTISE_URL:?Set the URL the control plane uses to reach this node}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?Set the control-plane API base URL}
      NODE_CAPACITY: ${NODE_CAPACITY:-2}
      PLATFORM_IMAGE: ${IMAGE:-swarmjet:local}
      NODE_LISTEN_ADDRESS: :8092
      META_COMMAND: ${META_COMMAND:-meta}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_MERGE_TOKEN: ${GITLAB_MERGE_TOKEN:-}
      INTEGRATION_ENV_ALLOWLIST: ${INTEGRATION_ENV_ALLOWLIST:-}
      AGENT_ENV_ALLOWLIST: ${AGENT_ENV_ALLOWLIST:-OPENAI_API_KEY,CODEX_API_KEY,ANTHROPIC_API_KEY,CLAUDE_CODE_OAUTH_TOKEN,DEEPSEEK_API_KEY,GEMINI_API_KEY,AGY_ADC_AUTH,GOOGLE_GEMINI_BASE_URL,OPENCODE_CONFIG_CONTENT}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGY_ADC_AUTH: ${AGY_ADC_AUTH:-}
      GOOGLE_GEMINI_BASE_URL: ${GOOGLE_GEMINI_BASE_URL:-}
      OPENCODE_CONFIG_CONTENT: ${OPENCODE_CONFIG_CONTENT:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-swarmjet}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-swarmjet@example.invalid}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-swarmjet}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-swarmjet@example.invalid}
    ports:
      - '${NODE_LISTEN_HOST:-127.0.0.1}:${NODE_PORT:-8092}:8092'
    volumes:
      - type: bind
        source: ${NODE_DATA_DIR:?Set NODE_DATA_DIR}
        target: ${NODE_DATA_DIR:?Set NODE_DATA_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
