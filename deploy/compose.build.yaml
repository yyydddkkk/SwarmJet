# Layer over compose.yaml when building from the repository checkout.
x-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile
services:
  api:
    build: *app-build
  migrate:
    build: *app-build
  # Built only with `--profile tools`; Cells run this image, the platform does
  # not start it as a long-running service.
  agent-image:
    image: ${AGENT_IMAGE:-swarmjet-agent:local}
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        AGENT_CLIS: ${AGENT_CLIS:-opencode}
