events {}
http {
  server {
    listen 443 ssl;
    ssl_certificate /etc/registry-tls/server.crt;
    ssl_certificate_key /etc/registry-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    location /v2/ {
      auth_basic "SwarmJet Registry";
      auth_basic_user_file /etc/registry-auth;
      # Mutation requests authenticate against a builder-only credential file.
      proxy_pass http://registry:5000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 900;
      proxy_request_buffering off;
      limit_except GET HEAD OPTIONS {
        auth_basic "SwarmJet Registry Push";
        auth_basic_user_file /etc/registry-tls/push.htpasswd;
      }
    }
    location / { return 404; }
  }
}
