# enable-template
log:
  stdout: true
  level: info
persistence:
  numHistoryShards: 512
  defaultStore: default
  visibilityStore: visibility
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: postgres:5432
        connectProtocol: tcp
        user: {{ env "POSTGRES_USER" | quote }}
        password: {{ env "POSTGRES_PWD" | quote }}
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: 1h
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: postgres:5432
        connectProtocol: tcp
        user: {{ env "POSTGRES_USER" | quote }}
        password: {{ env "POSTGRES_PWD" | quote }}
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: 1h
global:
  metrics:
    prometheus:
      framework: tally
      listenAddress: 0.0.0.0:8000
  membership:
    maxJoinDuration: 30s
    broadcastAddress: {{ env "TEMPORAL_BROADCAST_ADDRESS" | quote }}
services:
  frontend:
    rpc: {grpcPort: 7233, membershipPort: 6933, bindOnIP: 0.0.0.0, httpPort: 7243}
  matching:
    rpc: {grpcPort: 7235, membershipPort: 6935, bindOnIP: 0.0.0.0}
  history:
    rpc: {grpcPort: 7234, membershipPort: 6934, bindOnIP: 0.0.0.0}
  worker:
    rpc: {grpcPort: 7239, membershipPort: 6939, bindOnIP: 0.0.0.0}
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: 127.0.0.1:7233
      httpAddress: 127.0.0.1:7243
dcRedirectionPolicy:
  policy: noop
archival:
  history: {state: disabled}
  visibility: {state: disabled}
publicClient:
  hostPort: 127.0.0.1:7233
dynamicConfigClient:
  filepath: /etc/temporal/config/dynamicconfig/swarmjet.yaml
  pollInterval: 60s
