# docker compose --env-file registry.env -f deploy/compose.registry.yaml up -d
# Generate TLS/htpasswd files first; see docs/registry.md.
name: ${REGISTRY_PROJECT_NAME:-swarmjet-registry}
services:
  registry:
    image: registry:3
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:?Set a stable random secret}
      REGISTRY_LOG_LEVEL: info
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry-data:/var/lib/registry
    networks: [registry]
  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on: [registry]
    ports:
      - '${REGISTRY_BIND_HOST:-127.0.0.1}:${REGISTRY_PORT:-5443}:443'
    volumes:
      - ./registry/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${REGISTRY_TLS_DIR:?Set absolute TLS directory}:/etc/registry-tls:ro
      - ${REGISTRY_AUTH_FILE:?Set absolute htpasswd file}:/etc/registry-auth:ro
    networks: [registry]
volumes:
  registry-data:
networks:
  registry:
