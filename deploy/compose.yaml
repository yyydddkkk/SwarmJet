name: ${COMPOSE_PROJECT_NAME:-swarmjet}

# Shared environment for the platform image. Everything here is read by
# `swarmjet serve`; migrate only needs DATABASE_URL.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  # Internal-only scrape listener; no host port is published.
  METRICS_LISTEN_ADDRESS: ':9090'
  DATA_DIR: ${DATA_DIR:?Set DATA_DIR to an absolute host path}
  # Encrypts GitHub App credentials stored in the database. Back it up
  # separately from PostgreSQL; losing it means creating the App again.
  SWARMJET_MASTER_KEY: ${SWARMJET_MASTER_KEY:?Set SWARMJET_MASTER_KEY in .env}
  # Round-3 GitHub App. Either configure it from the console "setup" page or
  # keep the environment fallback from round 2. Environment wins when set.
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  # Set to http://tunnel:2000 when the optional tunnel profile is enabled.
  SWARMJET_TUNNEL_URL: ${SWARMJET_TUNNEL_URL:-}
  WEBHOOK_LISTEN_ADDRESS: ${WEBHOOK_LISTEN_ADDRESS:-:8081}
  # Forager Cells. This base file never mounts the Docker socket; enabling
  # Cells requires the compose.cells.yaml overlay, which also sets this to 1.
  SWARMJET_CELLS: ${SWARMJET_CELLS:-0}
  SWARMJET_DEFAULT_MODEL: ${SWARMJET_DEFAULT_MODEL:-deepseek/deepseek-chat}
  SWARMJET_CELL_MCP_URL: ${SWARMJET_CELL_MCP_URL:-http://swarmjet:8080/mcp}
  # Defaults to the same host as SWARMJET_CELL_MCP_URL with /llm.
  SWARMJET_CELL_LLM_URL: ${SWARMJET_CELL_LLM_URL:-}
  SWARMJET_CELL_NETWORK: ${SWARMJET_CELL_NETWORK:-}
  # Model boundary. compose.cells.yaml starts the auth broker/gateway and fills
  # these in; the base stack leaves them empty (no /llm endpoint).
  SWARMJET_LLM_GATEWAY_URL: ${SWARMJET_LLM_GATEWAY_URL:-}
  SWARMJET_AUTH_BROKER_URL: ${SWARMJET_AUTH_BROKER_URL:-}
  SWARMJET_OMP_CONFIG_DIR: ${SWARMJET_OMP_CONFIG_DIR:-}

x-app: &app
  image: ${IMAGE:-swarmjet:local}
  restart: unless-stopped
  stop_grace_period: 45s
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: '5'}

services:
  postgres:
    image: postgres:18.1-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: swarmjet
      POSTGRES_DB: swarmjet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U swarmjet -d swarmjet']
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    restart: 'no'
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

  api:
    <<: *app
    command: [serve]
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *app-environment
      AGENT_IMAGE: ${AGENT_IMAGE:-swarmjet-agent:local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD with at least 12 characters}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8180}
      SWARMJET_HOST_LISTEN_ADDRESS: ${LISTEN_HOST:-127.0.0.1}:${HTTP_PORT:-8180}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    ports:
      - '${LISTEN_HOST:-127.0.0.1}:${HTTP_PORT:-8180}:8080'
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set absolute DATA_DIR}
        target: ${DATA_DIR:?Set absolute DATA_DIR}
        read_only: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 12

  # Optional Cloudflare quick tunnel for hosts without a public domain.
  # Enable with `--profile tunnel` and set SWARMJET_TUNNEL_URL=http://tunnel:2000
  # (deploy/install.py does both). The platform reads /quicktunnel and syncs the
  # GitHub App webhook URL. The edge URL is temporary and changes on restart.
  # It forwards only the webhook listener (api:8081): the console and /mcp on
  # api:8080 are never reachable through the tunnel.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: [tunnel]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', --url, http://api:8081]
    ports:
      - '127.0.0.1:${TUNNEL_METRICS_PORT:-2000}:2000'

  # Optional baseline monitoring stack. Enable with `--profile observability`.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATA_SOURCE_URI: postgres:5432/swarmjet?sslmode=disable
      DATA_SOURCE_USER: swarmjet
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  alertmanager:
    image: prom/alertmanager:v0.30.1
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'

volumes:
  postgres-data:
  prometheus-data:
  alertmanager-data:
