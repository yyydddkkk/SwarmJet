# Apply only in an isolated test namespace. Label client with
# app.kubernetes.io/name=swarmjet-runner after baseline connectivity succeeds.
apiVersion: v1
kind: Pod
metadata:
  name: network-probe-server
  namespace: swarmjet-runners
  labels:
    probe: server
spec:
  automountServiceAccountToken: false
  containers:
    - name: server
      image: busybox:1.37.0
      command: [sh, -c, "mkdir -p /www; echo allowed >/www/index.html; httpd -f -p 8080 -h /www"]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: network-probe-client
  namespace: swarmjet-runners
  labels:
    probe: client
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: busybox:1.37.0
      command: [sh, -c, "sleep 3600"]
