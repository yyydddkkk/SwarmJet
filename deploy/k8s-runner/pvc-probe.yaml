# Throwaway workspace for the deterministic live-probe Job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sj-task-live-probe
  namespace: swarmjet-runners
  labels:
    app.kubernetes.io/name: swarmjet-runner
    swarmjet.io/task-id: live-probe
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
