# Apply in the isolated Runner namespace after namespace.yaml. The trusted
# controller alone may create these task-scoped integration resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swarmjet-integration-controller
  namespace: swarmjet-runners
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swarmjet-integration-controller
  namespace: swarmjet-runners
subjects:
  - kind: ServiceAccount
    name: swarmjet-job-controller
    namespace: swarmjet-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swarmjet-integration-controller
