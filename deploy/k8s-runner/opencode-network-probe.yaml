# Apply only for the isolated DeepSeek session probe. Production egress should
# resolve and constrain destination identities for its configured provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencode-probe-dns-https
  namespace: swarmjet-runners
spec:
  podSelector:
    matchLabels:
      probe: opencode-session
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
