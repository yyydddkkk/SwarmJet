# Run from deploy/ with:
# docker compose -p swarmjet-node-ingress -f compose.node-ingress.yaml up -d
# The explicit project name keeps this proxy separate from the app stack's
# COMPOSE_PROJECT_NAME in deploy/.env.
name: swarmjet-node-ingress
services:
  ingress:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./node-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
