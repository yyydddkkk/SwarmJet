services:
  app:
    image: python:3.13-slim
    command:
      - python
      - -u
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200 if self.path == '/healthz' else 404)
                self.end_headers()
                self.wfile.write(b'ok' if self.path == '/healthz' else b'not found')
        HTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; assert urllib.request.urlopen('http://localhost:8000/healthz').read() == b'ok'"]
      interval: 2s
      timeout: 2s
      retries: 30
  verifier:
    image: python:3.13-slim
    command: [python, -c, 'import time; time.sleep(86400)']
    depends_on:
      app: {condition: service_healthy}
