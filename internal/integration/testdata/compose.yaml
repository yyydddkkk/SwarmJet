services:
  producer:
    image: redis:8.4-alpine
    command: ["sh", "-c", "mkdir -p /data; echo ${SWARMJET_TASK_ID} > /data/result; sleep 3600"]
    volumes: ["exchange:/data"]
  verifier:
    image: redis:8.4-alpine
    command: ["sleep", "3600"]
    volumes: ["exchange:/data:ro"]
volumes:
  exchange: {}
